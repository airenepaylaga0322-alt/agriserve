{% extends "base.html" %} {% block title %}QR Code · Admin{% endblock %} {%
block content %}
<div class="text-center">
  <h2 style="color: #174d35">Scan to Access AgriServe</h2>
  <p class="text-muted">
    Point your phone camera at this QR code to open the live system.
  </p>

  <!-- This image is generated by the server using your actual URL -->
  <img
    src="{{ url_for('admin.qr_image') }}"
    alt="AgriServe QR Code"
    class="img-fluid"
    style="max-width: 300px"
  />

  <p class="mt-3"><strong>URL:</strong> {{ request.url_root }}</p>
  <a href="{{ request.url_root }}" class="btn btn-success" target="_blank"
    >Open in New Tab</a
  >
</div>
{% endblock %}
