{% extends "base.html" %} {% block title %}Login · AgriServe{% endblock %} {%
block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card shadow-sm border-0">
      <div class="card-body p-4">
        <h3 class="mb-3" style="color: #174d35">Log in</h3>

        <form method="POST" novalidate>
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input
              type="email"
              name="email"
              class="form-control"
              placeholder="you@example.com"
              required
            />
          </div>

          <div class="mb-3">
            <label class="form-label">Password</label>
            <div class="input-group">
              <input
                type="password"
                name="password"
                id="loginPassword"
                class="form-control"
                required
              />
              <button
                class="btn btn-outline-secondary"
                type="button"
                onclick="togglePassword('loginPassword', 'loginEye')"
              >
                <i class="bi bi-eye" id="loginEye"></i>
              </button>
            </div>
          </div>

          <button type="submit" class="btn btn-success w-100">Log In</button>
        </form>

        <p class="mt-3 mb-0 small text-muted">
          No account?
          <a href="{{ url_for('auth.register') }}">Register as a farmer</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
